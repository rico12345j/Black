<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📂 المستودع — GitHub Clone</title>
    <link rel="icon" href="/assets/icons/github.svg">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- ===== شريط التنقل ===== -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-left">
                <a href="/" class="nav-logo">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                </a>
                <div class="nav-links" id="navLinks">
                    <a href="/dashboard" class="nav-link">لوحة التحكم</a>
                    <a href="/explore" class="nav-link">استكشاف</a>
                    <a href="/trending" class="nav-link">الأكثر شيوعاً</a>
                </div>
            </div>
            <div class="nav-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="🔍 بحث..." onfocus="this.select()">
                </div>
                <div class="nav-actions">
                    <a href="/notifications" class="btn btn-outline">
                        <i class="fas fa-bell"></i>
                        <span class="badge">0</span>
                    </a>
                    <a href="/profile" class="btn btn-outline">
                        <i class="fas fa-user"></i>
                    </a>
                    <button onclick="logoutUser()" class="btn btn-outline">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- ===== المحتوى الرئيسي ===== -->
    <div class="container">
        <!-- ===== رأس المستودع ===== -->
        <div class="repo-header">
            <div class="repo-header-top">
                <div class="repo-title">
                    <i class="fas fa-book"></i>
                    <span class="repo-full-name">المستخدم / المستودع</span>
                </div>
                <div class="repo-actions">
                    <button class="btn btn-outline" id="starButton" data-repo-id="">
                        <i class="fas fa-star"></i> نجمة <span class="repo-stars-count">0</span>
                    </button>
                    <button class="btn btn-outline" id="watchButton" data-repo-id="">
                        <i class="fas fa-eye"></i> متابعة <span class="repo-watchers-count">0</span>
                    </button>
                    <button class="btn btn-outline" id="forkButton" data-repo-id="">
                        <i class="fas fa-code-branch"></i> نسخ <span class="repo-forks-count">0</span>
                    </button>
                </div>
            </div>
            <p class="repo-description">وصف المستودع</p>
            <div class="repo-meta">
                <span class="repo-language">JavaScript</span>
                <span class="repo-license">MIT</span>
                <span class="repo-updated">منذ 3 أيام</span>
            </div>
        </div>

        <!-- ===== علامات التبويب ===== -->
        <div class="repo-tabs">
            <a href="#" class="repo-tab active">
                <i class="fas fa-code"></i> الكود
            </a>
            <a href="#" class="repo-tab">
                <i class="fas fa-exclamation-circle"></i> القضايا <span class="repo-issues-count">0</span>
            </a>
            <a href="#" class="repo-tab">
                <i class="fas fa-code-branch"></i> طلبات السحب <span class="repo-pulls-count">0</span>
            </a>
            <a href="#" class="repo-tab">
                <i class="fas fa-project-diagram"></i> المشاريع
            </a>
            <a href="#" class="repo-tab">
                <i class="fas fa-cog"></i> الإعدادات
            </a>
        </div>

        <!-- ===== محتوى المستودع ===== -->
        <div class="repo-content">
            <div class="repo-content-header">
                <div class="repo-branch-selector">
                    <select id="branchSelector">
                        <option value="main">main</option>
                        <option value="develop">develop</option>
                    </select>
                </div>
                <div class="repo-actions">
                    <button class="btn btn-outline btn-small">
                        <i class="fas fa-plus"></i> إنشاء ملف
                    </button>
                </div>
            </div>

            <div class="repo-file-tree" id="fileTree">
                <!-- سيتم عرض شجرة الملفات هنا -->
            </div>

            <div class="repo-code-viewer" id="codeViewer">
                <!-- سيتم عرض محتوى الكود هنا -->
            </div>
        </div>
    </div>

    <!-- ===== التذييل ===== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <span>© 2024 GitHub Clone. جميع الحقوق محفوظة.</span>
                <div class="footer-links">
                    <a href="#">الشروط</a>
                    <a href="#">الخصوصية</a>
                    <a href="#">الأمان</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="/js/script.js"></script>
    <script src="/js/repo.js"></script>
</body>
</html>
