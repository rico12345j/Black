<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>👤 الملف الشخصي — GitHub Clone</title>
    <link rel="icon" href="/assets/icons/github.svg"><link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .profile-container { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
        .profile-header { display: flex; align-items: center; gap: 24px; padding: 24px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); flex-wrap: wrap; }
        .profile-header .avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--border-color); }
        .profile-header .info { flex: 1; }
        .profile-header .info .name { font-size: 28px; font-weight: 800; }
        .profile-header .info .username { color: var(--text-secondary); font-size: 18px; }
        .profile-header .info .bio { margin-top: 8px; color: var(--text-secondary); }
        .profile-header .info .stats { display: flex; gap: 24px; margin-top: 12px; flex-wrap: wrap; }
        .profile-header .info .stats .stat { text-align: center; }
        .profile-header .info .stats .stat .number { font-size: 20px; font-weight: 700; }
        .profile-header .info .stats .stat .label { font-size: 12px; color: var(--text-muted); }
        .profile-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-color); margin-top: 24px; flex-wrap: wrap; }
        .profile-tab { padding: 8px 16px; color: var(--text-secondary); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; transition: var(--transition); }
        .profile-tab:hover { color: var(--text-primary); }
        .profile-tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
    </style>
</head>
<body>
    <nav class="navbar">...</nav>
    <div class="profile-container">
        <div class="profile-header">
            <img class="avatar" src="https://ui-avatars.com/api/?name=User&background=2d9cdb&color=fff&size=128" alt="User">
            <div class="info">
                <div class="name">مستخدم</div>
                <div class="username">@username</div>
                <div class="bio">⚡ مطور ويب | مهتم بالأمن السيبراني</div>
                <div class="stats">
                    <div class="stat"><div class="number">12</div><div class="label">المستودعات</div></div>
                    <div class="stat"><div class="number">45</div><div class="label">المتابعون</div></div>
                    <div class="stat"><div class="number">23</div><div class="label">يتبع</div></div>
                    <div class="stat"><div class="number">67</div><div class="label">النجوم</div></div>
                </div>
                <button class="btn btn-primary" style="margin-top:12px;"><i class="fas fa-user-plus"></i> متابعة</button>
            </div>
        </div>
        <div class="profile-tabs">
            <a href="#" class="profile-tab active">المستودعات</a><a href="#" class="profile-tab">المشاريع</a><a href="#" class="profile-tab">القضايا</a><a href="#" class="profile-tab">طلبات السحب</a>
        </div>
        <div id="profileRepos" style="margin-top:16px;"><div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد مستودعات</p></div></div>
    </div>
    <footer class="footer">...</footer>
    <script src="/js/script.js"></script>
</body>
</html>
