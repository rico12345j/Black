<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 التسجيل — GitHub Clone</title>
    <link rel="icon" href="/assets/icons/github.svg">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-primary); padding: 20px; }
        .auth-container { max-width: 400px; width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 40px 32px; box-shadow: var(--shadow); }
        .auth-logo { text-align: center; margin-bottom: 24px; }
        .auth-logo i { font-size: 48px; color: var(--text-primary); }
        .auth-logo h1 { font-size: 24px; font-weight: 800; margin-top: 8px; }
        .auth-title { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .auth-subtitle { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
        .auth-form .form-group { margin-bottom: 16px; }
        .auth-form label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .auth-form input { width: 100%; padding: 10px 14px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius); color: var(--text-primary); font-size: 14px; transition: var(--transition); font-family: var(--font); }
        .auth-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1); }
        .auth-form .password-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .auth-footer { text-align: center; font-size: 14px; color: var(--text-secondary); margin-top: 16px; }
        .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .terms { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 12px; }
        .terms a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo"><i class="fab fa-github"></i><h1>GitHub</h1></div>
            <h2 class="auth-title">إنشاء حساب جديد</h2>
            <p class="auth-subtitle">انضم إلى ملايين المطورين حول العالم</p>
            <form class="auth-form" id="signupForm" onsubmit="event.preventDefault(); registerUser();">
                <div class="form-group"><label>اسم المستخدم</label><input type="text" id="signupUsername" placeholder="اختر اسم مستخدم" required></div>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="signupEmail" placeholder="أدخل بريدك الإلكتروني" required></div>
                <div class="form-group"><label>الاسم (اختياري)</label><input type="text" id="signupName" placeholder="أدخل اسمك"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="signupPassword" placeholder="أدخل كلمة مرور قوية" required><div class="password-hint">يجب أن تكون 8 أحرف على الأقل</div></div>
                <div class="form-group"><label>تأكيد كلمة المرور</label><input type="password" id="signupConfirmPassword" placeholder="أعد إدخال كلمة المرور" required></div>
                <button type="submit" class="btn btn-primary w-100">إنشاء حساب</button>
            </form>
            <div class="auth-footer">لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a></div>
            <div class="terms">بالتسجيل، أنت توافق على <a href="/terms">شروط الخدمة</a> و <a href="/privacy">سياسة الخصوصية</a></div>
        </div>
    </div>
    <script>
        async function registerUser() {
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const name = document.getElementById('signupName').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirmPassword').value;
            if (!username || !email || !password) { alert('يرجى ملء جميع الحقول المطلوبة'); return; }
            if (password !== confirm) { alert('كلمات المرور غير متطابقة'); return; }
            if (password.length < 8) { alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }
            try {
                const response = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password, name }) });
                const data = await response.json();
                if (data.success) { alert('✅ تم إنشاء الحساب بنجاح! يرجى التحقق من بريدك الإلكتروني.'); window.location.href = '/login'; } 
                else { alert(data.message || 'فشل إنشاء الحساب'); }
            } catch (error) { alert('حدث خطأ أثناء إنشاء الحساب'); }
        }
    </script>
</body>
</html>
