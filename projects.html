<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>📊 المشاريع — GitHub Clone</title>
<link rel="icon" href="/assets/icons/github.svg"><link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>.projects-container{max-width:1100px;margin:0 auto;padding:24px 16px;}.projects-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:20px;}.projects-header h1{font-size:28px;font-weight:800;display:flex;align-items:center;gap:12px;}.projects-header h1 i{color:var(--accent);}.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}.project-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:16px;transition:var(--transition);}.project-card:hover{border-color:var(--accent);transform:translateY(-2px);}.project-card h3{font-size:16px;font-weight:700;}.project-card p{color:var(--text-secondary);font-size:13px;}.project-card .progress{width:100%;height:6px;background:var(--bg-tertiary);border-radius:4px;margin-top:12px;overflow:hidden;}.project-card .progress .bar{height:100%;background:var(--accent);border-radius:4px;transition:width 0.5s;}.project-card .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-muted);}
</style></head>
<body><nav class="navbar">...</nav>
<div class="projects-container"><div class="projects-header"><h1><i class="fas fa-project-diagram"></i> المشاريع</h1><button class="btn btn-primary"><i class="fas fa-plus"></i> مشروع جديد</button></div>
<div class="project-grid">
<div class="project-card"><h3>إعادة تصميم الواجهة</h3><p>تحديث واجهة المستخدم بالكامل</p><div class="progress"><div class="bar" style="width:75%"></div></div><div class="meta"><span>75% مكتمل</span><span>3 أيام متبقية</span></div></div>
<div class="project-card"><h3>تحسين الأداء</h3><p>تحسين سرعة التطبيق</p><div class="progress"><div class="bar" style="width:40%"></div></div><div class="meta"><span>40% مكتمل</span><span>5 أيام متبقية</span></div></div>
<div class="project-card"><h3>توثيق API</h3><p>كتابة توثيق كامل للـ API</p><div class="progress"><div class="bar" style="width:90%"></div></div><div class="meta"><span>90% مكتمل</span><span>يوم واحد متبقي</span></div></div>
</div></div>
<footer class="footer">...</footer><script src="/js/script.js"></script></body></html>
