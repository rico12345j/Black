<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐙 404 — الصفحة غير موجودة</title>
    <link rel="icon" href="/assets/icons/github.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }
        .error-container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }
        .error-container .octocat {
            font-size: 80px;
            color: #58a6ff;
            margin-bottom: 16px;
            display: block;
        }
        .error-container .error-code {
            font-size: 96px;
            font-weight: 900;
            color: #58a6ff;
            letter-spacing: -0.05em;
            line-height: 1;
        }
        .error-container h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 12px 0 8px;
        }
        .error-container p {
            color: #8b949e;
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .error-container .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-container .btn {
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            font-family: 'Inter', 'Cairo', sans-serif;
        }
        .error-container .btn-primary {
            color: #fff;
            background: #58a6ff;
            border-color: #58a6ff;
        }
        .error-container .btn-primary:hover {
            background: #79c0ff;
            border-color: #79c0ff;
        }
        .error-container .btn-outline {
            color: #8b949e;
            border-color: #30363d;
            background: transparent;
        }
        .error-container .btn-outline:hover {
            color: #c9d1d9;
            border-color: #484f58;
        }
        .error-container .search-box {
            display: flex;
            align-items: center;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 4px 12px;
            margin: 16px auto 0;
            max-width: 400px;
            transition: all 0.3s ease;
        }
        .error-container .search-box:focus-within {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }
        .error-container .search-box i {
            color: #484f58;
            font-size: 14px;
        }
        .error-container .search-box input {
            background: transparent;
            border: none;
            color: #c9d1d9;
            padding: 8px 8px;
            font-size: 14px;
            outline: none;
            width: 100%;
            font-family: 'Inter', 'Cairo', sans-serif;
        }
        .error-container .search-box input::placeholder {
            color: #484f58;
        }
        @media (max-width: 600px) {
            .error-container .error-code { font-size: 64px; }
            .error-container h1 { font-size: 22px; }
            .error-container .actions { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="octocat">🐙</span>
        <div class="error-code">404</div>
        <h1>الصفحة غير موجودة</h1>
        <p>عذراً، الصفحة التي تبحث عنها غير موجودة. قد تكون تمت إزالتها أو تغيير اسمها.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> العودة إلى الرئيسية
            </a>
            <a href="/explore" class="btn btn-outline">
                <i class="fas fa-compass"></i> استكشاف
            </a>
            <a href="javascript:history.back()" class="btn btn-outline">
                <i class="fas fa-arrow-right"></i> رجوع
            </a>
        </div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="🔍 ابحث عن شيء آخر..." id="searchInput" onkeydown="if(event.key==='Enter'){window.location.href='/search?q='+encodeURIComponent(this.value)}">
        </div>
        <div style="margin-top: 32px; font-size: 13px; color: #484f58;">
            <a href="https://github.com" style="color: #484f58; text-decoration: none;">GitHub Clone</a> · 
            <a href="/" style="color: #484f58; text-decoration: none;">الرئيسية</a> · 
            <a href="/status" style="color: #484f58; text-decoration: none;">الحالة</a>
        </div>
    </div>
</body>
</html>
